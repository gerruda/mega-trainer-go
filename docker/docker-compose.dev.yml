version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - ../.env
    container_name: mega-trainer-bot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BOT_USER: ${BOT_USER}
      BOT_PASSWORD: ${BOT_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
#      - .:/app
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: mega-trainer-bot-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

networks:
  bot-network:
    driver: bridge