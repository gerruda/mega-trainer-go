version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: mega-trainer-bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    command: >
      postgres 
      -c listen_addresses='*'
      -c port=5432
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot-network

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    environment:
      - CONFIG_PATH=/app/configs/production.yaml
    depends_on:
      - postgres
      - redis
    networks:
      - bot-network
    restart: unless-stopped

  cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cron
    environment:
      - CONFIG_PATH=/app/configs/production.yaml
    depends_on:
      - postgres
    networks:
      - bot-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  bot-network:
    driver: bridge