name: mega-trainer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Applies the schema before the bot starts; the bot itself has no migration
  # logic, so a failed migration keeps the old version running.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["./migrate", "up"]
    env_file:
      - ../.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["./bot"]
    env_file:
      - ../.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Sends the scheduled "log your weight" reminders.
  cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["./cron"]
    env_file:
      - ../.env
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
