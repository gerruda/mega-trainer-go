name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./migrations)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: botdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d botdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          TEST_POSTGRES_DSN: host=localhost port=5432 user=bot password=bot dbname=botdb sslmode=disable
        run: go test -tags=integration -race -count=1 ./internal/storage/postgres/...

  e2e:
    name: e2e (fake Telegram, PostgreSQL, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: botdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d botdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: End-to-end tests
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_USER: bot
          TEST_POSTGRES_PASSWORD: bot
          TEST_POSTGRES_DB: botdb
          TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=e2e -race -count=1 ./internal/app/...
